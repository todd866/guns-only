name: Verify

# Production deployment enforces the full gate locally, and CI independently verifies pushes to
# the two release-bearing branches so an exact commit cannot appear green only on one workstation.
on:
  push:
    branches:
      - main
      - pivot-hardening
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/audio/requirements.txt

      - name: Install audio-tool dependencies
        run: python -m pip install -r tools/audio/requirements.txt

      - name: Run repository checks
        run: ./bin/check
