<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" font-family="IBM Plex Mono, ui-monospace, monospace">
  <rect width="100%" height="100%" fill="#f7f4ef"/>
  <text x="24" y="28" font-size="14" font-weight="700" fill="#1a1a1a">Plate 09  Performance envelope (honest) · rapier.public-data-surrogate.v1 @ 1.0.0</text>
  <text x="24" y="48" font-size="10" fill="#555">Sources: FlightModel · TurboRamjetPerformanceMap · intercept OFT energy-ladder · REALISM-AND-OVERPERFORMANCE.md</text>
  <line x1="24" y1="58" x2="696" y2="58" stroke="#222" stroke-width="1"/>

  <!-- axes: Mach vs altitude cartoon -->
  <text x="40" y="90" font-size="12" font-weight="700">Altitude / Mach boxes (surrogate profile vs measured peak)</text>
  <rect x="60" y="110" width="520" height="280" fill="#fff" stroke="#222"/>
  <!-- altitude ticks -->
  <text x="40" y="390" font-size="9" text-anchor="end">SL</text>
  <text x="40" y="300" font-size="9" text-anchor="end">FL350</text>
  <text x="40" y="220" font-size="9" text-anchor="end">FL560</text>
  <text x="40" y="150" font-size="9" text-anchor="end">FL700</text>
  <text x="60" y="410" font-size="9">M0</text>
  <text x="180" y="410" font-size="9">M1</text>
  <text x="300" y="410" font-size="9">M2</text>
  <text x="420" y="410" font-size="9">M3</text>
  <text x="540" y="410" font-size="9">M4</text>

  <!-- climb corridor -->
  <path d="M 80,380 L 160,240 L 220,200" fill="none" stroke="#3d9b7a" stroke-width="3"/>
  <text x="90" y="300" font-size="10" fill="#3d9b7a">climb ~M0.9</text>

  <!-- ram overlap -->
  <rect x="280" y="160" width="100" height="100" fill="#c4a35a" fill-opacity="0.25" stroke="#8a6210"/>
  <text x="290" y="210" font-size="10" fill="#8a6210">TBCC overlap</text>
  <text x="290" y="224" font-size="9" fill="#8a6210">M2.02.8</text>

  <!-- measured peak -->
  <circle cx="488" cy="155" r="8" fill="#c45c48"/>
  <text x="500" y="150" font-size="11" font-weight="700" fill="#c45c48">OFT peak H M3.69</text>
  <text x="500" y="166" font-size="9" fill="#c45c48">~70 kft · energy-ladder</text>

  <!-- fiction M4 -->
  <line x1="540" y1="120" x2="540" y2="380" stroke="#c45c48" stroke-dasharray="4 4"/>
  <text x="548" y="140" font-size="10" fill="#c45c48">M4 fiction</text>

  <!-- cards -->
  <rect x="60" y="440" width="190" height="60" fill="#fff" stroke="#3d9b7a"/>
  <text x="70" y="458" font-size="10" font-weight="700" fill="#3d9b7a">CLOSED / MEASURED</text>
  <text x="70" y="474" font-size="9">SLS dry 85 kN · capture 1.2 m²</text>
  <text x="70" y="488" font-size="9">OFT peak Mach 3.69</text>

  <rect x="265" y="440" width="200" height="60" fill="#fff" stroke="#8a6210"/>
  <text x="275" y="458" font-size="10" font-weight="700" fill="#8a6210">PROVISIONAL</text>
  <text x="275" y="474" font-size="9">Wet T/W ~1.39 (want d1.20)</text>
  <text x="275" y="488" font-size="9">Skin lag Ä 12 / 180 s</text>

  <rect x="480" y="440" width="200" height="60" fill="#fff" stroke="#c45c48"/>
  <text x="490" y="458" font-size="10" font-weight="700" fill="#c45c48">FICTION / OPEN</text>
  <text x="490" y="474" font-size="9">Sustained dash Mach 4</text>
  <text x="490" y="488" font-size="9">Lever-only fuel model</text>
</svg>
