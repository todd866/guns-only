  <text x="40" y="360" font-size="10" font-weight="700">BUILD NOTES (provisional)</text>
  <text x="40" y="378" font-size="9">Skin: composite sandwich · LE: CMC insert to ~15% chord (plate 08/20)</text>
  <text x="40" y="394" font-size="9">Thickness param 0.16 m max section (geometry helper) — not constant gauge</text>
  <text x="40" y="410" font-size="9">Incidence 0 · no dihedral · tip accent bolt-on (readability, not store)</text>
  <text x="40" y="426" font-size="9">Carry-through continuous through FS−1…+1.5 (plate 11)</text>
  <text x="40" y="442" font-size="9">S=18 m² · AR=3 · loading ~436 kg/m² at gross — spar sized for dive 12 G</text>
  <text x="40" y="458" font-size="9">Control: one elevon per side (combined pitch/roll) — no separate flap</text>
  <text x="40" y="474" font-size="9">Actuator in wing root (plate 15); cold-gas RCS does NOT unload wing at q>0</text>

